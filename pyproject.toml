[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "container-hardening-scanner"
version = "1.0.0"
description = "Container hardening for CI: multi-stage-aware Dockerfile analysis plus the runtime configuration a Dockerfile cannot express — no-new-privileges, dropped capabilities, read-only rootfs, seccomp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["docker", "container", "security", "hardening", "cis-benchmark", "devsecops", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.4", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
harden = "harden.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/container-hardening-scanner"

[tool.hatch.build.targets.wheel]
packages = ["src/harden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
